# Torizon OS - A/B + SWUpdate variant (no OSTree).
# Thin distro conf: shared foundation lives in include/torizon-ab-common.inc;
# this file selects the SWUpdate backend.

require conf/distro/include/torizon-ab-common.inc

DISTRO = "torizon-ab"
DISTRO_NAME = "Torizon OS (A/B + SWUpdate, no OSTree)"

# Shared token (':torizon-ab') + SWUpdate-backend token (':torizon-ab-swupdate').
DISTROOVERRIDES .= ":torizon-ab-swupdate"
TORIZON_AB_UPDATER = "swupdate"

# SWUpdate tooling.
DISTRO_FEATURES:append = " swupdate"

# A/B wic addressing slots by ext4 FS label (see wic/torizon-ab-x86.wks).
WKS_FILE:genericx86-64   = "torizon-ab-x86.wks"
WKS_FILE:intel-corei7-64 = "torizon-ab-x86.wks"
# U-Boot / i.MX: FAT boot + A/B rootfs (ext4 label otaroot_a/b + GPT part-name
# rootfs_a/b) + data. Same skeleton as the RAUC wks; slots also carry the ext4
# label SWUpdate roots on. The SoC boot firmware is added by the Tezi wrapper.
WKS_FILE:mx8mp-generic-bsp = "torizon-ab-swupdate-uboot.wks"
IMAGE_FSTYPES:append:mx8mp-generic-bsp = " wic wic.bmap"

# Torizon OS - A/B + RAUC variant (no OSTree).
# Same A/B architecture as torizon-ab (SWUpdate) but the OS update is applied by
# RAUC instead of SWUpdate. Shared foundation lives in
# include/torizon-ab-common.inc; this file selects the RAUC backend.

require conf/distro/include/torizon-ab-common.inc

DISTRO = "torizon-ab-rauc"
DISTRO_NAME = "Torizon OS (A/B + RAUC, no OSTree)"

# Shared token (':torizon-ab') + RAUC-backend token (':torizon-ab-rauc').
DISTROOVERRIDES .= ":torizon-ab-rauc"
TORIZON_AB_UPDATER = "rauc"

# RAUC addresses A/B slots by GPT PARTLABEL (survives raw ext4 writes, so no
# ext4-label restore is needed) and uses its own grub.cfg (ORDER/*_OK/*_TRY),
# so it needs a dedicated wic distinct from the SWUpdate one.
WKS_FILE:genericx86-64   = "torizon-ab-rauc-x86.wks"
WKS_FILE:intel-corei7-64 = "torizon-ab-rauc-x86.wks"

# Bundle/target compatible string (system.conf and the bundle manifest must match).
RAUC_COMPATIBLE ?= "torizon-ab-rauc-${MACHINE}"

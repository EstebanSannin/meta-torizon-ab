# GRUB config for Torizon OS A/B + RAUC.
#
# Boot selection and rollback use RAUC's grub-backend variables in the shared
# grubenv (managed by `rauc` and by rauc-grub-ab's grubenv-create):
#   ORDER          slot boot priority, bootnames (e.g. "A B")
#   <name>_OK      slot is known-good (1) or not (0)
#   <name>_TRY     boot attempts of a slot on trial (0 = fresh/confirmed)
#
# Each boot arms the chosen slot's _TRY=1; greenboot's health hook runs
# `rauc status mark-good` on a healthy boot, which clears _TRY and sets _OK=1.
# If a trial slot reboots without being marked good, its _TRY stays 1 and the
# next boot falls through to the other slot in ORDER (rollback).
#
# NOTE: menuentries reference the slot partitions by fixed GPT position
# (p2=slot A, p3=slot B) on the boot disk (hd0), since GRUB's `search` cannot
# match a GPT partition label. root=PARTLABEL=/rauc.slot= drive the OS side.

set timeout=3
load_env

# Defaults if the grubenv is missing/empty (grubenv-create normally sets these).
if [ -z "${ORDER}" ]; then set ORDER="A B"; fi
if [ -z "${A_OK}" ];  then set A_OK=1; fi
if [ -z "${A_TRY}" ]; then set A_TRY=0; fi
if [ -z "${B_OK}" ];  then set B_OK=0; fi
if [ -z "${B_TRY}" ]; then set B_TRY=0; fi

# Load a slot's OK/TRY/index into OK/TRY/idx.
function load_slot {
    if [ "$1" = "A" ]; then set OK="${A_OK}"; set TRY="${A_TRY}"; set idx=0; fi
    if [ "$1" = "B" ]; then set OK="${B_OK}"; set TRY="${B_TRY}"; set idx=1; fi
}

# First and second bootname in ORDER (two-slot A/B).
regexp --set=1:first  '^([AB])'  "${ORDER}"
regexp --set=1:second '([AB])$'  "${ORDER}"

set default=0
set chosen=

# Prefer the first slot in ORDER if OK and not already on a failed trial.
load_slot "${first}"
if [ "${OK}" = "1" ]; then
    if [ "${TRY}" = "0" ]; then set chosen="${first}"; set default="${idx}"; fi
fi
# Otherwise the second slot.
if [ -z "${chosen}" ]; then
    load_slot "${second}"
    if [ "${OK}" = "1" ]; then
        if [ "${TRY}" = "0" ]; then set chosen="${second}"; set default="${idx}"; fi
    fi
fi
# Fallback: nothing eligible -> boot the first slot in ORDER anyway.
if [ -z "${chosen}" ]; then
    set chosen="${first}"
    load_slot "${first}"
    set default="${idx}"
fi

# Arm the chosen slot on trial; greenboot's mark-good clears it when healthy.
if [ "${chosen}" = "A" ]; then set A_TRY=1; save_env A_TRY; fi
if [ "${chosen}" = "B" ]; then set B_TRY=1; save_env B_TRY; fi

set kargs="rootfstype=ext4 rw quiet console=tty0 console=ttyS0,115200"

menuentry "Torizon OS (slot A)" {
    set root=(hd0,gpt2)
    linux /boot/bzImage root=PARTLABEL=rootfs_a rauc.slot=A ${kargs}
    initrd /boot/initramfs
}

menuentry "Torizon OS (slot B)" {
    set root=(hd0,gpt3)
    linux /boot/bzImage root=PARTLABEL=rootfs_b rauc.slot=B ${kargs}
    initrd /boot/initramfs
}
